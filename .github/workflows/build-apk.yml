name: Build FC Mobile RO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -q FC_Mobile_RO_Android_v0.3_build_ready.zip -d source

      - name: Generate Android project
        working-directory: source/FC_Mobile_RO_Android
        run: flutter create . --platforms=android --org=ro.fcmoblero --project-name=fc_mobile_ro

      - name: Install dependencies
        working-directory: source/FC_Mobile_RO_Android
        run: flutter pub get

      - name: Build APK
        working-directory: source/FC_Mobile_RO_Android
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-Mobile-RO-APK
          path: source/FC_Mobile_RO_Android/build/app/outputs/flutter-apk/app-release.apk
